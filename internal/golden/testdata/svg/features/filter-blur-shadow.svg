<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2 0.6"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#1d1d1f" flood-opacity="0.45"/>
    </filter>
    <filter id="classic" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feOffset in="b" dx="3" dy="3" result="o"/>
      <feFlood flood-color="#5e5ce6" flood-opacity="0.6"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="100" y="100" width="100" height="100" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="30" fill="#ff453a" filter="url(#blur)"/>
  <rect x="110" y="25" width="70" height="50" rx="8" fill="#0a84ff" filter="url(#soft)"/>
  <rect x="20" y="115" width="60" height="60" rx="10" fill="#ffd60a" filter="url(#drop)"/>
  <g filter="url(#classic)" transform="translate(0 0)">
    <path d="M115 175 L150 110 L185 175 Z" fill="#30d158"/>
  </g>
  <circle cx="150" cy="150" r="12" fill="#ff9f0a" filter="url(#glow)"/>
</svg>
