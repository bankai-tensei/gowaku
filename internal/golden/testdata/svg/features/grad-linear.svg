<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="box">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="50%" stop-color="#ff9f0a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="180" y2="0" gradientTransform="rotate(20 100 140)">
      <stop offset="0" stop-color="#30d158"/>
      <stop offset="0.2" stop-color="#64d2ff"/>
      <stop offset="0.4" stop-color="#0a84ff"/>
      <stop offset="0.6" stop-color="#5e5ce6"/>
      <stop offset="0.8" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="hard" x2="0" y2="1">
      <stop offset="0.5" stop-color="#1d1d1f"/>
      <stop offset="0.5" stop-color="#f2f2f7"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="85" height="80" rx="8" fill="url(#box)"/>
  <rect x="105" y="10" width="85" height="80" rx="8" fill="url(#diag)"/>
  <rect x="10" y="100" width="180" height="60" fill="url(#user)"/>
  <rect x="10" y="168" width="180" height="24" fill="url(#hard)" transform="skewX(-10) translate(30 0)"/>
</svg>
