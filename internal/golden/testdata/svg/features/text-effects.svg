<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="words">
      <text x="100" y="80" font-family="Arial" font-size="56" font-weight="bold" text-anchor="middle">CLIP</text>
    </clipPath>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="20" width="200" height="70" fill="url(#sky)" clip-path="url(#words)"/>
  <text x="100" y="140" font-family="Georgia, serif" font-size="30" text-anchor="middle" fill="#ff9f0a" filter="url(#shadow)">Shadow</text>
  <text x="100" y="180" font-family="Arial" font-size="20" text-anchor="middle" fill="none" stroke="#ff375f" stroke-width="1.5" stroke-dasharray="3 2">outlined</text>
</svg>
