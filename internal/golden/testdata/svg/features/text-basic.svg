<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x2="1">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="10" y="30" font-size="22" fill="#1d1d1f">Hello, SVG</text>
    <text x="100" y="60" font-size="16" text-anchor="middle" fill="#0a84ff">centered <tspan font-weight="bold" fill="#ff453a">bold</tspan> run</text>
    <text x="190" y="85" font-size="14" text-anchor="end" font-style="italic" fill="#30d158">ends here</text>
    <text x="10" y="125" font-size="34" font-weight="bold" fill="url(#g)" stroke="#1d1d1f" stroke-width="1">Gradient</text>
    <text x="10" y="160" font-size="16" letter-spacing="3" fill="#bf5af2">spaced out</text>
    <text x="10" y="190" font-size="16" fill="#ff9f0a">a<tspan dy="-6">up</tspan><tspan dy="6" dx="4">down</tspan></text>
    <line x1="120" y1="180" x2="195" y2="180" stroke="#c7c7cc"/>
    <text x="125" y="180" font-size="14" dominant-baseline="central" fill="#636366">mid</text>
    <text x="160" y="180" font-size="14" dominant-baseline="hanging" fill="#636366">top</text>
  </g>
</svg>
