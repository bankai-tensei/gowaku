<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle">
      <circle cx="55" cy="55" r="40"/>
    </clipPath>
    <clipPath id="box" clipPathUnits="objectBoundingBox">
      <rect x="0.1" y="0.1" width="0.8" height="0.35"/>
      <rect x="0.1" y="0.55" width="0.8" height="0.35"/>
    </clipPath>
    <clipPath id="star" clip-rule="evenodd">
      <path d="M150 15 L170 85 L110 40 L190 40 L130 85 Z"/>
    </clipPath>
    <clipPath id="nested" clip-path="url(#circle)">
      <rect x="15" y="15" width="40" height="80"/>
    </clipPath>
    <linearGradient id="g" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#30d158"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle)">
    <rect x="0" y="0" width="200" height="200" fill="url(#g)"/>
    <path d="M10 60 H100" stroke="#ff453a" stroke-width="10"/>
  </g>
  <rect x="105" y="5" width="90" height="90" fill="#ff9f0a" clip-path="url(#star)"/>
  <rect x="10" y="110" width="85" height="80" fill="#bf5af2" clip-path="url(#box)"/>
  <g clip-path="url(#nested)" transform="translate(0 0)">
    <rect x="0" y="0" width="200" height="200" fill="#1d1d1f" opacity="0.25"/>
  </g>
  <g transform="translate(150 150) rotate(20)">
    <clipPath id="local"><rect x="-30" y="-20" width="60" height="40" rx="8"/></clipPath>
    <g clip-path="url(#local)">
      <circle r="35" fill="#ff375f"/>
      <circle r="18" fill="#ffffff"/>
    </g>
  </g>
</svg>
