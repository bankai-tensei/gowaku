<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff453a"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="5" fill="#0a84ff"/>
    </marker>
    <marker id="tick" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M6 0V12" stroke="#30d158" stroke-width="2"/>
    </marker>
    <marker id="fixed" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="4" markerHeight="4" orient="45deg">
      <rect width="10" height="10" fill="#bf5af2"/>
    </marker>
  </defs>
  <line x1="20" y1="25" x2="180" y2="25" stroke="#1d1d1f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <polyline points="20,100 60,50 100,100 140,50 180,100" fill="none" stroke="#1d1d1f" stroke-width="2"
            marker-start="url(#dot)" marker-mid="url(#tick)" marker-end="url(#arrow)"/>
  <path d="M30 170 C30 120 100 120 100 170 S170 220 170 140" fill="none" stroke="#1d1d1f" stroke-width="3"
        style="marker: url(#dot)" marker-end="url(#arrow)"/>
  <polygon points="130,125 175,125 175,160" fill="none" stroke="#636366" stroke-width="2" marker-mid="url(#fixed)"/>
</svg>
