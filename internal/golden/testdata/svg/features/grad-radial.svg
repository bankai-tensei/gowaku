<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sphere" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0040dd"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd60a" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="user" gradientUnits="userSpaceOnUse" cx="150" cy="150" r="40" fx="170" fy="140" xlink:href="#sphere"/>
    <radialGradient id="ellipse" xlink:href="#glow"/>
  </defs>
  <circle cx="55" cy="55" r="45" fill="url(#sphere)"/>
  <rect x="105" y="10" width="85" height="90" fill="url(#glow)"/>
  <rect x="10" y="110" width="85" height="80" rx="40" fill="url(#ellipse)" stroke="#ff9f0a" stroke-width="2"/>
  <circle cx="150" cy="150" r="40" fill="url(#user)"/>
</svg>
